backend:
  name: github
  repo: shunfeng01/blog
  branch: main
  base_url: https://pan-admin.placeholder.workers.dev
  auth_endpoint: api/auth

local_backend: false

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    summary: "{{title}} · {{published}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: published, label: 发布日期, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm }
      - { name: description, label: 摘要, widget: text }
      - name: tags
        label: 标签
        widget: list
        field: { name: tag, label: 标签, widget: string }
      - { name: category, label: 分类, widget: string }
      - { name: draft, label: 草稿（勾选则不发布）, widget: boolean, default: false }
      - { name: body, label: 正文, widget: markdown }